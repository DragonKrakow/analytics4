<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b0b0d;
    color: #eeeeee;
    font-family: Arial, sans-serif;
    line-height: 1.7;
}

header {
    padding: 20px 5%;
    border-bottom: 1px solid #333;
}

main {
    max-width: 940px;
    margin: 40px auto;
    padding: 0 22px;
}

a {
    color: #ff963c;
}

.lang {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    margin: 24px 0;
}

.lang [aria-current] {
    font-weight: bold;
    text-decoration: underline;
}

.post {
    display: block;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 20px;
    margin: 18px 0;
    text-decoration: none;
    color: inherit;
}

.post:hover {
    border-color: #ff963c;
}

.post img {
    max-width: 200px;
    width: 35%;
    height: auto;
    float: right;
    margin-left: 20px;
}

article img {
    max-width: 100%;
    height: auto;
}

article {
    overflow-wrap: anywhere;
}

article h1 {
    line-height: 1.2;
}

@media (max-width: 600px) {
    .post img {
        float: none;
        width: 100%;
        max-width: 100%;
        margin: 0 0 15px;
    }
}
