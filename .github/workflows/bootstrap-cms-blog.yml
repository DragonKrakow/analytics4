name: Convert existing articles for CMS (run once)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4 markdown markdownify pyyaml requests
      - run: python cms_blog.py bootstrap
      - name: Save editable posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- content/posts/
          if ! git diff --cached --quiet; then
            git commit -m "Convert existing blog posts into CMS editor format"
            git push
          fi
