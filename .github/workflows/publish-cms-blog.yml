name: Publish CMS blog
on:
  push:
    branches: [main]
    paths:
      - 'content/posts/**'
      - 'cms_blog.py'
      - '.github/workflows/publish-cms-blog.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cms-blog-build
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install beautifulsoup4 markdown markdownify pyyaml requests
      - name: Generate pages, archives and homepage feeds
        run: python cms_blog.py build
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- Blog content/blog_cards*.json content/blog_languages.json content/blog_manifest.json content/cms_generated_paths.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish blog updates from CMS"
            git push
          fi
