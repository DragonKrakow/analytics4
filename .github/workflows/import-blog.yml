
name: Import original blog (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests beautifulsoup4

      - name: Extract blog and download images
        run: |
          python migrate_blog.py --pages 12 --download-assets

      - name: Repair blog images and build homepage data
        run: |
          python build_blog_media.py

      - name: Show blog import summary
        if: always()
        run: |
          echo "=== Blog import summary ==="
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = Path("content/blog_manifest.json")
          cards = Path("content/blog_cards.json")

          if manifest.exists():
              data = json.loads(manifest.read_text(encoding="utf-8"))
              print("Discovered:", data.get("discovered", 0))
              print("Exported:", data.get("exported", 0))
              print("Failed:", data.get("failed_articles", 0))

          if cards.exists():
              data = json.loads(cards.read_text(encoding="utf-8"))
              print("Homepage blog cards:", len(data))
              print("Cards with images:", sum(bool(p.get("image")) for p in data))
          PY

      - name: Commit imported files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

           git add -A -- Blog assets/blog content/

          if ! git diff --cached --quiet; then
            git commit -m "Update Analytics4 blog articles and images"
            git push
          else
            echo "No changes to commit"
          fi
